<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФСО | Справочно-экзаменационный центр</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <svg width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M18 6 L22 14 L30 16 L24 22 L26 30 L18 26 L10 30 L12 22 L6 16 L14 14 Z" fill="currentColor"/>
                </svg>
            </div>
            <div>
                <div class="logo-text">ФСО РФ</div>
                <div class="logo-sub">Справочный центр</div>
            </div>
        </div>
        
        <nav class="nav" id="mainNav">
            <div class="nav-section">📘 Справочный центр</div>
            <button class="nav-item active" data-page="legislation">
                <span class="nav-icon">⚖️</span> Законодательство
            </button>
            <button class="nav-item" data-page="charter">
                <span class="nav-icon">📜</span> Устав ФСО
            </button>
            <button class="nav-item" data-page="regulations">
                <span class="nav-icon">📋</span> Служебные инструкции
            </button>
            <button class="nav-item" data-page="structure">
                <span class="nav-icon">🏛</span> Структура
            </button>
            
            <div class="nav-section">📝 Экзаменационный отдел</div>
            <button class="nav-item" data-page="training">
                <span class="nav-icon">📚</span> Подготовка
                <span class="badge" id="trainingBadge">0</span>
            </button>
            <button class="nav-item" data-page="exams">
                <span class="nav-icon">🎯</span> Экзамены
                <span class="badge" id="examsBadge">0</span>
            </button>
            <button class="nav-item" data-page="statistics">
                <span class="nav-icon">📊</span> Статистика
            </button>
            
            <div class="nav-section">⚙️ Администрирование</div>
            <button class="nav-item" data-page="admin">
                <span class="nav-icon">🔧</span> Управление
            </button>
        </nav>
        
        <div class="user-bar" id="userBar">
            <div class="avatar" id="userAvatar">Г</div>
            <div class="user-info">
                <div class="user-name" id="userName">Гость</div>
                <div class="user-role" id="userRole">Не авторизован</div>
            </div>
            <button class="btn btn-sm btn-outline" id="logoutBtn" style="display:none;margin-left:auto;" 
                    onclick="Auth.logout();App.updateUserInterface();App.navigate('legislation');">
                Выход
            </button>
        </div>
    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main">
        <div class="tabs" id="tabsContainer"></div>
        <div class="content" id="contentArea">
            <div class="loader">Загрузка...</div>
        </div>
    </main>

    <!-- ==================== MODAL ==================== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- ==================== NOTIFICATION CONTAINER ==================== -->
    <div id="notificationContainer" style="position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/instruction-editor.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
